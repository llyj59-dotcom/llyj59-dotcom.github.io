<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="주간 진도표와 담임 요청을 반영해 학년 시간표를 짜고 주간학습안내를 만드는 도구"><meta name="theme-color" content="#f3f5f3"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><style>[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head><body>
<title>주간쌤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&display=swap">
<style id="appcss">
/* Layout: 흰 사이드바(주 고르기 + 매주 할 일 5단계 + 필요할 때) → 회색 바탕 위 흰 카드로 된 단계 화면, 아래에 떠 있는 ‘다음 단계’ 바. 휴대폰에서는 사이드바가 위로 올라갑니다. 출력물은 A4 종이 미리보기. */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --surface-2:#f8faf9; --fill:#eff2f0; --fill-2:#e3e8e5;
  --line:#e8ece9; --line-strong:#cfd7d2; --fg:#17201b; --fg-2:#2e3933; --muted:#65716a; --faint:#89948e;
  --accent:#1f7a5a; --accent-ink:#ffffff; --accent-soft:#e5f3ec; --accent-strong:#165f45;
  --err:#d93a3a; --err-soft:#fdeeee; --warn:#b85c00; --warn-soft:#fff3e3; --ok:#2f8a3f; --ok-soft:#e9f5e7;
  --sel:#1f7a5a; --sel-soft:#e5f3ec;
  --chipL:93%; --chipS:62%; --chipInk:#17201b;
  --paper:#ffffff; --ink:#111111; --paper-line:#333333; --paper-shade:#e4e4e4;
  --shadow:0 1px 2px rgba(16,40,30,.05),0 2px 8px rgba(16,40,30,.04);
  --shadow-lg:0 8px 28px rgba(16,40,30,.12);
  --font-ui:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','IBM Plex Sans KR','Malgun Gothic',system-ui,sans-serif;
  --font-display:var(--font-ui);
  --font-doc:'Gowun Batang','Batang','바탕',serif;
  --r:20px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1311; --surface:#1a1f1c; --surface-2:#1e2420; --fill:#262c29; --fill-2:#313834;
  --line:#262c29; --line-strong:#3e4642; --fg:#eef2ef; --fg-2:#d3dad6; --muted:#9ba69f; --faint:#7b8680;
  --accent:#4fbf93; --accent-ink:#0b1a13; --accent-soft:#15302a; --accent-strong:#86d9b6;
  --err:#ff7a7a; --err-soft:#3a1d1d; --warn:#f2b257; --warn-soft:#382915; --ok:#8fd27c; --ok-soft:#1e3320;
  --sel:#4fbf93; --sel-soft:#15302a; --chipL:25%; --chipS:30%; --chipInk:#eef2ef;
  --shadow:none; --shadow-lg:0 8px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1311; --surface:#1a1f1c; --surface-2:#1e2420; --fill:#262c29; --fill-2:#313834;
  --line:#262c29; --line-strong:#3e4642; --fg:#eef2ef; --fg-2:#d3dad6; --muted:#9ba69f; --faint:#7b8680;
  --accent:#4fbf93; --accent-ink:#0b1a13; --accent-soft:#15302a; --accent-strong:#86d9b6;
  --err:#ff7a7a; --err-soft:#3a1d1d; --warn:#f2b257; --warn-soft:#382915; --ok:#8fd27c; --ok-soft:#1e3320;
  --sel:#4fbf93; --sel-soft:#15302a; --chipL:25%; --chipS:30%; --chipInk:#eef2ef;
  --shadow:none; --shadow-lg:0 8px 28px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--font-ui);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;margin:0}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.02em}
.wrap{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
/* 위쪽 바 (담임·처음 화면·로그인·요청서) */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);color:var(--fg)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#2c9670,#17654b);color:#fff;display:grid;place-items:center;font:800 16px/1 var(--font-ui);letter-spacing:-.04em;flex:none;box-shadow:0 2px 6px rgba(31,122,90,.32)}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:-.03em;line-height:1.25}
.brand small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.ctx{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex:1;min-width:0}
.weeknav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.weeklabel{font-weight:700;padding-inline:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.savebox{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--faint)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
main{padding-block:28px 64px;display:flex;flex-direction:column;gap:16px}

/* 담당자 화면 틀 */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh;align-items:start}
.nav{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;background:var(--surface);border-right:1px solid var(--line);color:var(--fg);padding:20px 14px 16px;display:flex;flex-direction:column;gap:18px}
.nav-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-inline:6px}
.nav .btn.nav-more-btn{display:none}
.weekcard{background:var(--fill);border-radius:16px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px}
.wc-label{font-size:12px;color:var(--muted);font-weight:600;padding-inline:2px}
.wc-grade{font-size:12.5px;color:var(--muted);font-weight:600;padding-inline:2px}
.wc-nav{display:flex;align-items:center;justify-content:space-between;gap:6px}
.wc-nav b{font-size:19px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;text-align:center;flex:1}
.wc-nav button{width:32px;height:32px;border-radius:50%;border:0;background:var(--surface);color:var(--fg);cursor:pointer;font-size:18px;line-height:1;flex:none;box-shadow:var(--shadow)}
.wc-nav button:hover{background:var(--fill-2)}
.wc-sub{font-size:12.5px;color:var(--muted);text-align:center}
.wc-date{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--faint)}
.weekcard .wc-date input[type=date]{background:var(--surface);border:0;border-radius:8px;padding:3px 8px;font-size:12.5px;color:var(--fg)}
.weekcard select{background:var(--surface)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:inherit}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
.nav-h{font-size:12px;color:var(--faint);font-weight:600;padding:8px 10px 4px}
.navsteps{display:flex;flex-direction:column;gap:2px;position:relative}
.ns{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:var(--fg-2);padding:9px 10px;border-radius:12px;cursor:pointer;transition:background .15s}
.ns:hover{background:var(--fill)}
.ns i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--fill);color:var(--muted)}
.ns span{display:flex;flex-direction:column;min-width:0}
.ns b{font-weight:600;font-size:14.5px;letter-spacing:-.02em}
.ns small{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ns em{font-style:normal;font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 8px}
.ns.done i{background:var(--accent-soft);color:var(--accent)}
.ns.cur{background:var(--accent-soft);color:var(--fg)}
.ns.cur b{color:var(--accent-strong)}
.ns.cur i{background:var(--accent);color:#fff}
.nav-tools{display:flex;flex-direction:column;gap:1px;margin-top:auto}
.nt{display:flex;flex-direction:column;align-items:flex-start;border:0;background:none;color:var(--fg-2);padding:8px 10px;border-radius:10px;cursor:pointer;text-align:left;font-size:14px;font-weight:500}
.nt small{font-size:12px;color:var(--faint);font-weight:400}
.nt:hover{background:var(--fill)}
.nt.cur{background:var(--accent-soft);color:var(--accent-strong)}
.nav-foot{border-top:1px solid var(--line);margin-top:10px;padding:12px 10px 0;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted)}
.nav-foot .row{gap:12px}
.nav-foot .linkbtn{color:var(--muted);font-weight:500}
.nav-foot .linkbtn:hover{color:var(--fg)}
.stage{padding-block:36px 0;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0;max-width:1240px;width:100%}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));gap:10px}
  .nav .btn.nav-more-btn{display:inline-flex}
  .weekcard{flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px 10px}
  .wc-label,.wc-date{display:none}
  .wc-nav{flex:1;min-width:220px}
  .navsteps{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px;scrollbar-width:none}
  .navsteps .nav-h{display:none}
  .ns{grid-template-columns:24px auto;width:auto;flex:none;padding:6px 12px 6px 6px;border-radius:999px}
  .ns i{width:24px;height:24px;font-size:12px}
  .ns small,.ns em{display:none}
  .nav-tools{display:none;margin-top:0}
  .nav-tools.open{display:flex}
  .stage{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:22px}
}

/* 단계 제목과 아래 바 */
.stephead{display:flex;flex-direction:column;gap:8px;padding-bottom:4px}
.eyebrow{font-size:13.5px;font-weight:600;color:var(--accent);letter-spacing:-.01em}
.stephead h1{font-size:30px;font-weight:700;line-height:1.3;letter-spacing:-.035em}
.lead{font-size:16px;color:var(--muted);margin:0;max-width:62ch;line-height:1.6}
.todo{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 8px;counter-reset:td}
.todo li{counter-increment:td;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--fg-2);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;box-shadow:var(--shadow)}
.todo li::before{content:counter(td);width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;display:grid;place-items:center}
.stepfoot{position:sticky;bottom:12px;z-index:15;margin-top:12px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-radius:18px;box-shadow:var(--shadow-lg)}
.sf-note{flex:1;min-width:0;color:var(--muted);font-size:13.5px;text-align:center}
.subnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sn{flex:none;display:flex;align-items:center;gap:8px;border:0;background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;font-size:14px;font-weight:500;color:var(--fg-2);box-shadow:var(--shadow)}
.sn i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.sn.cur{background:var(--accent);color:#fff;font-weight:600}
.sn.cur i{background:rgba(255,255,255,.22);color:#fff}

/* 한눈에 보기 */
.progline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:14px;color:var(--muted)}
.prog{width:min(320px,100%);height:8px;border-radius:999px;background:var(--fill-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .4s}
.nextcard{background:linear-gradient(135deg,#1f7a5a 0%,#165f45 100%);color:#fff;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;box-shadow:0 10px 30px rgba(22,95,69,.25)}
.nextcard .eyebrow{color:rgba(255,255,255,.82)}
.nextcard h2{font-size:26px;font-weight:700;letter-spacing:-.035em;line-height:1.3}
.nextcard p{margin:0;color:rgba(255,255,255,.86);max-width:58ch}
.nextcard .btn.primary{background:#fff;color:#165f45;margin-top:10px}
.nextcard .btn.primary:hover{background:#eef8f3;filter:none}
.ovgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media (min-width:1280px){.ovgrid{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}}
.ovcard{display:grid;grid-template-columns:30px auto 1fr;grid-template-areas:"n t p" "n d d";align-items:center;column-gap:12px;row-gap:2px;text-align:left;padding:16px;border:0;border-radius:var(--r);background:var(--surface);cursor:pointer;min-width:0;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.ovcard:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.ovcard b{font-size:16px;font-weight:700;grid-area:t;letter-spacing:-.02em}
.ovcard .pill{grid-area:p;justify-self:start}
.ovcard .ov-n{grid-area:n;align-self:start}
.ovcard .ov-d{grid-area:d}
@media (min-width:1280px){.ovcard{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:18px}}
.ov-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--fill);color:var(--muted)}
.ovcard.done .ov-n{background:var(--accent-soft);color:var(--accent)}
.ovcard.now{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.ovcard.now .ov-n{background:var(--accent);color:#fff}
.ov-d{font-size:13px;color:var(--muted);line-height:1.5}
.weekstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ws{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--fill)}
.ws b{font-size:15px;font-weight:700}
.ws.off{color:var(--faint)}
.ws.chg{background:var(--warn-soft)}
.ws small{font-size:12px;color:var(--muted)}
@media (max-width:640px){.weekstrip{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}}

/* 펼쳐 보기 */
.det{border-radius:var(--r);background:var(--surface);min-width:0;box-shadow:var(--shadow)}
.det-h{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:16px 20px;cursor:pointer;text-align:left;border-radius:var(--r)}
.det-h:hover{background:var(--surface-2)}
.det-h > span:first-child{flex:1;display:flex;flex-direction:column;min-width:0}
.det-h b{font-size:16px;font-weight:700;letter-spacing:-.02em}
.det-h small{font-size:13px;color:var(--muted)}
.det-h i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--fill);color:var(--muted);display:grid;place-items:center;font-size:17px;flex:none}
.det-b{padding:0 20px 20px;display:flex;flex-direction:column;gap:12px}
.det.open > .det-h{border-radius:var(--r) var(--r) 0 0;margin-bottom:4px}

/* 큰 시작 칸 */
.hero-cta{border-radius:24px;background:var(--surface);padding:32px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;box-shadow:var(--shadow)}
.hero-cta h2{font-size:26px;font-weight:700;letter-spacing:-.035em;line-height:1.3}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;align-items:baseline;font-size:15px;color:var(--fg-2)}
.checks li::before{content:"✓";font-weight:800;color:var(--accent);width:16px;flex:none}
.checks li.warn::before{content:"!";color:var(--warn)}
.checks li.err::before{content:"!";color:var(--err)}
.dropzone{border:2px dashed color-mix(in srgb,var(--accent) 35%,var(--line-strong));border-radius:24px;padding:40px 20px;text-align:center;cursor:pointer;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;transition:background .15s,border-color .15s}
.dropzone b{font-size:20px;font-weight:700;letter-spacing:-.03em}
.dropzone span{color:var(--muted);font-size:14px}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.methods{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:1180px){.methods{grid-template-columns:repeat(3,minmax(0,1fr))}.methods.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.method{background:var(--surface);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.method .m-n{font-size:13px;font-weight:600;color:var(--accent)}
.method h3{font-size:17px;font-weight:700}
.method p{margin:0;font-size:14px;color:var(--muted)}
.tabs{display:inline-flex;gap:2px;background:var(--fill);border-radius:12px;padding:3px;align-self:flex-start}
.tabs button{border:0;background:none;padding:8px 16px;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--muted);border-radius:10px;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.status-hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:20px 22px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.status-hero b{font-size:20px;font-weight:700;letter-spacing:-.03em}
.status-hero.ok{background:var(--ok-soft)}
.speccard{box-shadow:inset 5px 0 0 var(--sc,var(--line-strong)),var(--shadow)}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 12px;border-radius:14px;background:var(--fill)}
.grp input,.grp select{background:var(--surface)}
.wzsteps{list-style:none;margin:6px 0 0;padding:0;display:flex;gap:6px;flex-wrap:wrap;counter-reset:wz}
.wzsteps li{counter-increment:wz;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);padding:5px 14px 5px 5px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow)}
.wzsteps li::before{content:counter(wz);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--fill);font-weight:700;font-size:12px}
.wzsteps li.cur{color:var(--fg);font-weight:600}
.wzsteps li.cur::before{background:var(--accent);color:#fff}
.wzsteps li.done::before{content:"✓";background:var(--accent-soft);color:var(--accent)}

/* 공통 부품 */

/* ---------- 말로 요청 넣기 ---------- */
const DAY_CH = '월화수목금';
function parseNumList(str, max) {
  const out = new Set();
  for (const part of String(str).split(/[,·\s]+|와|과|및/)) {
    const m = part.match(/^(\d{1,2})\s*[~\-]\s*(\d{1,2})$/); if (m) { for (let i = +m[1]; i <= +m[2]; i++) if (i >= 1 && i <= max) out.add(i); continue; }
    if (/^\d{1,2}$/.test(part) && +part >= 1 && +part <= max) out.add(+part);
  }
  return [...out].sort((a, b) => a - b);
}
function parseReqText(text, o) {
  let src = String(text || '').replace(/\r/g, '');
  src = src.replace(new RegExp(`${o.grade}\\s*학년\\s*`, 'g'), ' ');
  src = src.replace(new RegExp(`(^|[^\\d])${o.grade}\\s*-\\s*(\\d{1,2})(?!\\d)(?!\\s*교시)\\s*반?`, 'g'), (m, pre, c) => `${pre}${c}반 `);
  const clauses = []; let buf = '';
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    if ('\n/;.'.includes(ch)) { clauses.push(buf); buf = ''; continue; }
    if (ch === ',') { const rest = src.slice(i + 1).trimStart(); if (/^\d/.test(rest)) { buf += ch; continue; } clauses.push(buf); buf = ''; continue; }
    buf += ch;
  }
  clauses.push(buf);
  const splitByClass = c => { const ms = [...c.matchAll(/((?:\d{1,2}\s*(?:[,·~\-]|와|과|및)\s*)*\d{1,2})\s*반/g)]; const out = []; let st = 0; ms.forEach((m, i) => { if (i > 0 && c.slice(st, m.index).trim()) { out.push(c.slice(st, m.index)); st = m.index; } }); out.push(c.slice(st)); return out; };
  const parts = clauses.flatMap(c => c.split(/\s(?:그리고|그리구|또)\s/)).flatMap(splitByClass).map(c => c.trim()).filter(Boolean);
  const subs = o.subjects.filter(s => s.name.replace(/\s/g, '').length >= 2);
  const scan = c => {
    const r = { cls: null, pairs: [], dayOnly: null, t: null, s: null, lv: null };
    const cm = [...c.matchAll(/((?:\d{1,2}\s*(?:[,·~\-]|와|과|및)\s*)*\d{1,2})\s*반/g)];
    if (cm.length) r.cls = [...new Set(cm.flatMap(m => parseNumList(m[1], o.n)))];
    let c2 = c; for (const m of cm) c2 = c2.replace(m[0], ' '.repeat(m[0].length));
    const toks = [];
    for (const m of c2.matchAll(/(?<![가-힣])([월화수목금])(?:요일)?\s*[~\-]\s*([월화수목금])(?:요일)?/g)) toks.push({ i: m.index, e: m.index + m[0].length, k: 'day', v: range(DAY_CH.indexOf(m[1]), DAY_CH.indexOf(m[2])) });
    for (const m of c2.matchAll(/(?<![가-힣])([월화수목금]{1,5})(?=요일|\s|\d|[,·~\-)]|$|에|엔|은|는|랑)/g)) toks.push({ i: m.index, e: m.index + m[0].length, k: 'day', v: [...m[1]].map(ch => DAY_CH.indexOf(ch)) });
    for (const m of c2.matchAll(/매일|날마다|모든\s*요일|전체\s*요일|요일\s*상관\s*없이/g)) toks.push({ i: m.index, e: m.index + m[0].length, k: 'day', v: [0, 1, 2, 3, 4] });
    for (const m of c2.matchAll(/((?:\d{1,2}\s*(?:교시)?\s*(?:[,·~\-]|와|과|및)\s*)*\d{1,2})\s*교시/g)) toks.push({ i: m.index, e: m.index + m[0].length, k: 'per', v: parseNumList(m[1].replace(/교시/g, ','), o.maxP) });
    for (const m of c2.matchAll(/오전|오후/g)) toks.push({ i: m.index, e: m.index + m[0].length, k: 'per', v: m[0] === '오전' ? range(1, o.lunch) : range(o.lunch + 1, o.maxP) });
    toks.sort((a, b) => a.i - b.i || (b.e - b.i) - (a.e - a.i));
    let last = -1, days = [], lastPer = false;
    for (const t of toks) {
      if (t.i < last) continue; last = t.e;
      if (t.k === 'day') { if (lastPer) { days = []; lastPer = false; } days = [...new Set([...days, ...t.v])]; }
      else { const prev = r.pairs[r.pairs.length - 1]; if (lastPer && prev && prev.d.join() === days.join()) prev.p = [...new Set([...prev.p, ...t.v])].sort((a, b) => a - b); else r.pairs.push({ d: days.slice(), p: t.v }); lastPer = true; }
    }
    if (!r.pairs.length && days.length) r.dayOnly = days;
    const hit = re => { let pos = -1; for (const m of c.matchAll(re)) pos = Math.max(pos, m.index); return pos; };
    const sub = subs.find(s => c.replace(/\s/g, '').includes(s.name.replace(/\s/g, '')));
    const pHome = hit(/담임/g), pFree = hit(/전담|비워|비우|빼\s*주|회의|상담|출장|연수|공강|협의|참석|자리\s*비/g);
    if (/담임\s*(?:수업)?\s*(?:말고|대신|아니)/.test(c)) r.t = 'free';
    else if (/전담\s*(?:수업)?\s*(?:말고|대신|아니|빼)/.test(c)) r.t = 'home';
    else if (sub && !/담임/.test(c)) { r.t = 'subj'; r.s = sub.id; }
    else if (pHome >= 0 || pFree >= 0) r.t = pHome > pFree ? 'home' : 'free';
    if (/매주|매번|항상|고정으로|계속/.test(c)) r.rep = true;
    if (/꼭|반드시|필수|무조건/.test(c)) r.lv = 1; else if (/있으면\s*좋|여유\s*되면/.test(c)) r.lv = 3; else if (/가능하면|되면|웬만하면|가급적|희망/.test(c)) r.lv = 2;
    return r;
  };
  const parsed = parts.map(scan);
  let cur = o.fixedClass ? [o.fixedClass] : [], carry = null; const groups = [];
  parsed.forEach(r => {

  const maxP = Math.max(1, ...D.days.map(d => d.off ? 0 : d.periods));
  const draw = () => {
    const extra = (d, p) => { const k = `${d}-${p}`; const f = D.fixed[`${st.c}|${k}`]; if (f) return f + '(고정)'; const e = D.ext.find(x => x.c === st.c && x.k === k); return e ? e.label : null; };
    const must = Object.values(st.cells).filter(r => r.lv === 1).length;
    const code = st.c ? '주간요청:' + b64e(JSON.stringify({ v: 1, g: D.grade, m: D.monday, c: st.c, cells: st.cells, memo: st.memo, at: Date.now() })) : '';
    $('#app').innerHTML = `
    <header class="bar"><div class="wrap"><div class="bar-in"><div class="brand"><span class="mark" aria-hidden="true">주</span><div><b>${D.grade}학년 시간표 요청서</b><small>${esc([D.school, D.title].filter(Boolean).join(' · '))}</small></div></div></div></div></header>
    <main class="wrap" style="max-width:820px">
      <div class="callout">우리 반을 고르고, 원하는 칸을 눌러 요청을 넣은 뒤 맨 아래 <b>요청 코드 복사</b>를 눌러 담당 선생님께 메신저로 보내 주세요.${D.deadline ? ` <b>마감: ${esc(D.deadline)}</b>` : ''}</div>
      ${D.generic ? `<div class="callout warn">일반 시간표(요일별 기본 교시)로 보여 드려요. 그 주 행사·휴업은 담당 선생님 쪽에서 반영됩니다.</div>` : ''}
      <section class="panel"${D.preClass ? ' hidden' : ''}><header><h2>1. 우리 반</h2></header>
        <div class="chips">${range(1, D.n).map(x => `<button class="chip" data-r="cls" data-c="${x}" aria-pressed="${x === st.c}">${D.grade}-${x}${D.homeroom?.[x] ? ` <span class="n">${esc(D.homeroom[x])}</span>` : ''}</button>`).join('')}</div></section>
      ${st.c ? `<section class="panel"><header><h2>${D.preClass ? `${D.grade}학년 ${st.c}반 요청` : '2. 요청 칸 고르기'}</h2><span class="muted small">같은 칸을 다시 누르면 지워집니다</span></header>
        ${paletteHTML(st.tool, D.subjects, true).replace(/data-act="tool"/g, 'data-r="tool"').replace(/data-act="lv"/g, 'data-r="lv"').replace('data-ch="toolSubj"', 'id="rqSubj"')}
        <div class="chatin"><textarea id="rqChat" rows="2" placeholder="말로 적어도 돼요: 화요일 2교시는 담임, 목요일 3·4교시는 상담이라 전담" aria-label="요청 문장"></textarea><button class="btn" data-r="chat">칸으로 넣기</button></div>
        <p class="hint"><b>전담 희망</b> = 이 시간에 전담 수업을 넣어 주세요(회의·상담 등). <b>담임 수업</b> = 이 시간은 제가 수업합니다. <b>필수</b>는 꼭 필요한 경우에만 (최대 ${D.maxMust}개).</p>
        ${must > D.maxMust ? `<div class="callout warn">필수가 ${must}개입니다. ${D.maxMust}개 이하로 줄여 주세요.</div>` : ''}
        ${reqCellsHTML(D.days, maxP, D.lunch, st.c, D.n, st.cells, subName, extra).replace(/data-act="reqCell"/g, 'data-r="cell"')}
        <label class="f">이유 한 줄 (선택)<input type="text" id="rqMemo" value="${esc(st.memo)}" placeholder="예: 목요일 3교시 학부모 상담"></label>
      </section>
      <section class="panel"><header><h2>3. 보내기</h2></header>
        <textarea id="rqCode" rows="3" readonly>[주간요청] ${D.grade}-${st.c}반 · ${esc(md(D.monday))} 주 · ${Object.keys(st.cells).length}건\n${code}</textarea>
        <div class="row"><button class="btn primary" data-r="copy">요청 코드 복사</button><span class="hint">요청이 없어도 보내 주시면 ‘요청 없음’으로 처리됩니다.</span></div>
      </section>` : ''}
    </main>`;
  };
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-r]'); if (!el) return; const r = el.dataset.r;
    if (r === 'cls') { st.c = +el.dataset.c; st.cells = {}; st.memo = ''; try { const s2 = JSON.parse(localStorage.getItem(DKEY + '-' + st.c) || 'null'); if (s2) { st.cells = s2.cells; st.memo = s2.memo; } } catch (x) { } }
    if (r === 'tool') st.tool.t = el.dataset.t;
    if (r === 'lv') st.tool.lv = +el.dataset.lv;
    if (r === 'cell') { const k = `${el.dataset.d}-${el.dataset.p}`; const cur = st.cells[k]; const t = st.tool; if (t.t === 'erase' || (cur && cur.t === t.t && cur.lv === t.lv && (t.t !== 'subj' || cur.s === t.s))) delete st.cells[k]; else st.cells[k] = t.t === 'subj' ? { t: 'subj', s: t.s, sn: sn(t.s), lv: t.lv } : { t: t.t, lv: t.lv }; }
    if (r === 'chat') { chatToCells(); return; }
    if (r === 'copy') { const t = $('#rqCode'); t.select(); copyText(t.value); return; }
    persist(); draw();
  });
  const chatToCells = () => {
    const ta = $('#rqChat'); const text = (ta?.value || '').trim(); if (!text || !st.c) return;
    const items = parseReqText(text, { grade: +D.grade, n: D.n, subjects: D.subjects, lunch: +D.lunch, maxP, fixedClass: st.c, defaultLv: 2 });
    let n = 0, bad = 0;
    for (const it of items) { if (!it.d.length || !it.p.length || !it.t) { bad++; continue; } for (const d of it.d) for (const p of it.p) { st.cells[`${d}-${p}`] = it.t === 'subj' ? { t: 'subj', s: it.s, sn: sn(it.s), lv: it.lv } : { t: it.t, lv: it.lv }; n++; } }
    persist(); draw(); toast(n ? `${n}칸 넣었어요${bad ? ` · ${bad}건은 요일·교시를 찾지 못했어요` : ''}` : '요일과 교시를 찾지 못했어요. “화요일 2교시 담임”처럼 적어 주세요.');
  };
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.target.id === 'rqChat') { e.preventDefault(); chatToCells(); } });
  document.addEventListener('change', e => { if (e.target.id === 'rqMemo') { st.memo = e.target.value; persist(); draw(); } if (e.target.id === 'rqSubj') { st.tool.s = e.target.value; st.tool.t = 'subj'; persist(); draw(); } });
  draw();
}

/* ===================================================================
   시작
   =================================================================== */
if (EMBED.mode === 'request') runRequestMode();
else {
  document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const f = ACT[el.dataset.act]; if (f) f(el, e); });
  document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el && CH[el.dataset.ch]) CH[el.dataset.ch](el); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.target.id === 'chatIn') { e.preventDefault(); ACT.chatSend(); return; }
    if (e.key === 'Enter' && !e.isComposing && /^lg(Email|Pw|Pw2)$/.test(e.target.id)) { e.preventDefault(); ACT.lgGo(); return; }
    if (e.key === 'Escape' && ui.sel) { resetSel(); render(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && S.ui?.tab === 'tt' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); ACT.undo(); }
  });
  $('#fileIn').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o.grades || !o.weeks) throw 0; const u = S.ui, nm = S.spaceName, ow = S.owner; S = { ...blankState(), ...o, ui: u }; S.spaceName = S.spaceName || nm; S.owner = ow; S.reqs ??= {}; for (const k in S.weeks) { const w = S.weeks[k]; if (w.reqs) { const [g, m] = k.split('|'); for (const c in w.reqs) S.reqs[reqKey(g, m, c)] ??= w.reqs[c]; delete w.reqs; } } S.ui = { ...defaultUI(), ...(u || {}) }; if (!S.grades[S.ui.grade]) S.ui.grade = Object.keys(S.grades)[0]; resetSel(); ui.undo = []; commit(); toast('백업을 불러왔습니다'); } catch (x) { toast('이 파일은 주간학습 백업 파일이 아닙니다'); } e.target.value = ''; };
    rd.readAsText(f);
  });
  document.addEventListener('dragover', e => { const z = e.target.closest?.('.dropzone'); if (!z) return; e.preventDefault(); z.classList.add('over'); });
  document.addEventListener('dragleave', e => { const z = e.target.closest?.('.dropzone'); if (z) z.classList.remove('over'); });
  document.addEventListener('drop', e => { const z = e.target.closest?.('.dropzone'); if (!z) return; e.preventDefault(); z.classList.remove('over'); const f = e.dataTransfer?.files?.[0]; if (f) importPlanFile(f); });
  $('#progFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) importPlanFile(f); e.target.value = ''; });
  boot();
}
</script>

</body></html>
